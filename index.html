<!DOCTYPE html>
<html lang="cs">
<head>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker zaregistrován!'));
        });
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="QuickSpeech ABC">
    <meta property="og:description" content="Nauč se americký slang efektivně a prakticky.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./icon.png">
    <title>QuickSpeech ABC</title>
    
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #141e30 0%, #243b55 100%); font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .nav-bar { padding: 15px; text-align: center; background: linear-gradient(135deg, #141e30 0%, #243b55 100%); flex-shrink: 0; }
        select { padding: 10px; font-size: 1.2rem; border-radius: 10px; cursor: pointer; }
        #uvod { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        #frame { flex-grow: 1; width: 100%; border: none; display: none; background: linear-gradient(135deg, #141e30 0%, #243b55 100%); }
    </style>
</head>
<body>
    <div class="nav-bar">
        <select onchange="
            var uvod = document.getElementById('uvod');
            var frame = document.getElementById('frame');
            if(this.value === '') { 
                uvod.style.display = 'flex'; 
                frame.style.display = 'none'; 
                frame.src = 'about:blank'; 
            } else { 
                uvod.style.display = 'none'; 
                frame.style.display = 'block'; 
                frame.src = this.value; 
            }
        ">
            <option value="">-- Vyber téma --</option>
            <option value="auto.html">AUTOPŮJČOVNA & SILNICE 🚗</option>
            <option value="bar.html">BAR & NOČNÍ ŽIVOT 🍺</option>
            <option value="barvy.html">REÁLNÉ BARVY 🎨</option>
            <option value="cas.html">ČAS & NESTÍHAČKY ⏱️</option>
            <option value="crypto.html">KRYPTO & TRADING 🪙</option>
            <option value="dane_a_dyska.html">DANĚ & DÝŠKA 💸</option>
            <option value="data.html">MOBILNÍ DATA & WI-FI 📶</option>
            <option value="doprava.html">VEŘEJNÁ DOPRAVA & TAXI 🚇</option>
            <option value="drogy.html">ULICE & SLANG LÁTEK 🌿</option>
            <option value="finance.html">FINANCE & CASH 💵</option>
            <option value="foto.html">FOCENÍ & INSTAGRAM 📷</option>
            <option value="gastro.html">GASTRO & JÍDLO 🍔</option>
            <option value="gym.html">POSILOVNA & FITNESS 🏋️</option>
            <option value="hotel.html">HOTEL & UBYTOVÁNÍ 🏨</option>
            <option value="it-tech.html">TECHNOLOGIE & IT 💻</option>
            <option value="kempovani.html">KEMPOVÁNÍ & PŘÍRODA 🏕️</option>
            <option value="komunita.html">KOMUNITA & ČTVRŤ 🏙️</option>
            <option value="nouzove_situace.html">NOUZOVÉ SITUACE 🚨</option>
            <option value="letiste.html">LETIŠTĚ & LETY ✈️</option>
            <option value="nakupovani.html">NAKUPOVÁNÍ 🛍️</option>
            <option value="policie.html">POLICIE & KONTROLY 👮🚨</option>
            <option value="rande.html">RANDE & FLIRTOVÁNÍ ❤️🔥</option>
            <option value="zivel.html">ŽIVELNÉ POHROMY 🔥🌊</option>
        </select>
    </div>

    <div id="uvod">
        <h2>🌍 Vítejte v aplikaci QuickSpeech ABC!</h2>
        <p>Vyberte si požadované téma z rozbalovacího menu nahoře pro zobrazení frází.</p>
    </div>

    <iframe id="frame" src="about:blank"></iframe>
</body>
</html>
